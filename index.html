<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071b2b" />
    <!-- GitHub Pages SPA Routing: 404.html tarafından yönlendirilen URL'i geri yükle -->
    <script>
      (function () {
        var spa = sessionStorage.getItem('spa_redirect_path');
        if (spa) {
          sessionStorage.removeItem('spa_redirect_path');
          // URL'i geri yükle (sayfa yeniden yüklenmeden)
          window.history.replaceState(null, '', spa);
        }
      })();
    </script>
    <meta name="description" content="Kartvizit, etiket, magnet ve broşür için ücretsiz tasarım desteği, kaliteli baskı ve Türkiye geneli gönderim." />
