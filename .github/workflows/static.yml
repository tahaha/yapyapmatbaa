name: Yapyapmatbaa GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4

      - name: pnpm kur
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Bağımlılıkları kur
        run: pnpm install --frozen-lockfile

      - name: React sitesini derle
        run: pnpm build

      - name: GitHub Pages'i yapılandır
        uses: actions/configure-pages@v5

      - name: Derlenmiş siteyi yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
